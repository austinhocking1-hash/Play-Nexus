<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tile Merge — Play Nexus</title>
<link rel="stylesheet" href="game.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#7c5cff">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Play Nexus">
<meta name="description" content="Slide the tiles and merge matching numbers to build bigger ones. Swipe or use the arrow keys, and keep the board from filling up.">
<meta property="og:title" content="Tile Merge — Play Nexus">
<meta property="og:description" content="Slide the tiles and merge matching numbers to build bigger ones. Swipe or use the arrow keys, and keep the board from filling up.">
<meta property="og:image" content="https://letsplaynexus.online/icon-512.png">
<link rel="canonical" href="https://letsplaynexus.online/games/tile-merge.html">
</head>
<body>

<div class="game-header">
  <a href="../index.html" class="back-link">&larr; Back to Play Nexus</a>
  <span class="game-title">Tile <span>Merge</span></span>
</div>

<div class="game-stage">
  <canvas id="stage" width="440" height="440"></canvas>
  <div class="game-msg" id="msg">
    <h2>Tile Merge</h2>
    <p>Slide the tiles and merge matching numbers to build bigger ones. Swipe or use the arrow keys, and keep the board from filling up.</p>
    <button class="btn" id="startBtn">Start Merging</button>
  </div>
</div>

<div class="hud">
  <span>Score: <b id="scoreEl">0</b></span>
  <span>Best: <b id="bestEl">0</b></span>
</div>
<p class="controls-hint">Controls: Arrow keys / WASD, or swipe</p>
<div class="ad-slot"></div>
<script src="../ads.js"></script>

<script src="../config.js"></script>
<script src="nexus-score.js"></script>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const msg = document.getElementById('msg');
const startBtn = document.getElementById('startBtn');
const $ = id => document.getElementById(id);
const GAME_NAME = 'Tile Merge';
function showEnd(head, text, again) {
  msg.classList.remove('hidden');
  msg.innerHTML = '<h2>' + head + '</h2><p>' + text + '</p>';
  const b = document.createElement('button');
  b.className = 'btn'; b.textContent = again; b.onclick = start;
  msg.appendChild(b);
}

const SZ = 4, PAD = 10, TS = (W - PAD * (SZ + 1)) / SZ;
const COL = { 2: '#3b3f7a', 4: '#4a4f9a', 8: '#7c5cff', 16: '#a24cff', 32: '#ff5c9e', 64: '#ff3a6e', 128: '#ff9f1c', 256: '#ffb84c', 512: '#ffe27a', 1024: '#4ade80', 2048: '#2fd0ff' };
let grid, score, running, over;
let best = Number(localStorage.getItem('tile-best') || 0);
$('bestEl').textContent = best;
function empty() { const e = []; for (let r = 0; r < SZ; r++) for (let c = 0; c < SZ; c++) if (!grid[r][c]) e.push([r, c]); return e; }
function addTile() { const e = empty(); if (!e.length) return; const [r, c] = e[(Math.random() * e.length) | 0]; grid[r][c] = Math.random() < 0.9 ? 2 : 4; }
function start() {
  msg.classList.add('hidden');
  grid = Array.from({ length: SZ }, () => Array(SZ).fill(0)); score = 0; running = true;
  addTile(); addTile(); $('scoreEl').textContent = 0; draw();
}
function slideLine(line) {
  const t = line.filter(Boolean), out = []; let gained = 0;
  for (let i = 0; i < t.length; i++) {
    if (t[i] === t[i + 1]) { out.push(t[i] * 2); gained += t[i] * 2; i++; } else out.push(t[i]);
  }
  while (out.length < SZ) out.push(0);
  return [out, gained];
}
function move(dir) { // 0 left,1 up,2 right,3 down
  if (!running) return;
  let moved = false, gain = 0;
  const g = grid.map(r => r.slice());
  for (let i = 0; i < SZ; i++) {
    let line = [];
    for (let j = 0; j < SZ; j++) line.push(dir === 0 ? g[i][j] : dir === 2 ? g[i][SZ - 1 - j] : dir === 1 ? g[j][i] : g[SZ - 1 - j][i]);
    const [res, gd] = slideLine(line); gain += gd;
    for (let j = 0; j < SZ; j++) {
      const v = res[j];
      const [r, c] = dir === 0 ? [i, j] : dir === 2 ? [i, SZ - 1 - j] : dir === 1 ? [j, i] : [SZ - 1 - j, i];
      if (grid[r][c] !== v) moved = true;
      grid[r][c] = v;
    }
  }
  if (!moved) return;
  score += gain; if (gain) NexusScore.tone(300 + Math.min(500, gain * 4), 0, 0.08, 'triangle', 0.05);
  addTile(); $('scoreEl').textContent = score; draw();
  if (!canMove()) end();
}
function canMove() {
  if (empty().length) return true;
  for (let r = 0; r < SZ; r++) for (let c = 0; c < SZ; c++) {
    if (c + 1 < SZ && grid[r][c] === grid[r][c + 1]) return true;
    if (r + 1 < SZ && grid[r][c] === grid[r + 1][c]) return true;
  }
  return false;
}
function draw() {
  ctx.fillStyle = '#12142e'; ctx.fillRect(0, 0, W, H);
  for (let r = 0; r < SZ; r++) for (let c = 0; c < SZ; c++) {
    const x = PAD + c * (TS + PAD), y = PAD + r * (TS + PAD), v = grid[r][c];
    ctx.fillStyle = v ? (COL[v] || '#fff') : '#1e2142';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, TS, TS, 10) : ctx.rect(x, y, TS, TS); ctx.fill();
    if (v) {
      ctx.fillStyle = v >= 512 && v < 1024 ? '#2a1d00' : '#fff';
      ctx.font = '800 ' + (v < 100 ? 40 : v < 1000 ? 34 : 28) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(v, x + TS / 2, y + TS / 2 + 2);
    }
  }
}
function end() {
  running = false;
  if (score > best) { best = score; localStorage.setItem('tile-best', best); $('bestEl').textContent = best; }
  showEnd('No moves left', 'You scored <b>' + score + '</b>. Best: <b>' + best + '</b>', 'Play Again');
  NexusScore.submit(GAME_NAME, score);
}
addEventListener('keydown', e => {
  const m = { ArrowLeft: 0, a: 0, ArrowUp: 1, w: 1, ArrowRight: 2, d: 2, ArrowDown: 3, s: 3 }[e.key];
  if (m !== undefined && running) { e.preventDefault(); move(m); }
});
let sx, sy;
canvas.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
canvas.addEventListener('pointerup', e => {
  if (sx == null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0); else move(dy > 0 ? 3 : 1);
});
grid = Array.from({ length: SZ }, () => Array(SZ).fill(0)); draw();

startBtn.addEventListener('click', start);
</script>

<script>
(function(){
  function report(message, stack){
    try {
      fetch('/api/games/tile-merge/report-error', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: String(message).slice(0,500), stack: String(stack||'').slice(0,2000)})
      });
    } catch(e) {}
  }
  window.addEventListener('error', function(e){ report(e.message, e.error && e.error.stack); });
  window.addEventListener('unhandledrejection', function(e){
    report('Unhandled promise rejection: ' + e.reason, e.reason && e.reason.stack);
  });
})();
</script>
<script src="/track.js" defer></script>
</body>
</html>
