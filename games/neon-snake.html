<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake — Play Nexus</title>
<link rel="stylesheet" href="game.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#7c5cff">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Play Nexus">
<meta name="description" content="Eat the glowing food, grab gold bonuses and never touch a wall or yourself. The faster you go, the higher you score.">
<meta property="og:title" content="Neon Snake — Play Nexus">
<meta property="og:description" content="Eat the glowing food, grab gold bonuses and never touch a wall or yourself. The faster you go, the higher you score.">
<meta property="og:image" content="https://letsplaynexus.online/icon-512.png">
<link rel="canonical" href="https://letsplaynexus.online/games/neon-snake.html">
</head>
<body>

<div class="game-header">
  <a href="../index.html" class="back-link">&larr; Back to Play Nexus</a>
  <span class="game-title">Neon <span>Snake</span></span>
</div>

<div class="game-stage">
  <canvas id="stage" width="480" height="480"></canvas>
  <div class="game-msg" id="msg">
    <h2>Neon Snake</h2>
    <p>Eat the glowing food, grab gold bonuses and never touch a wall or yourself. The faster you go, the higher you score.</p>
    <button class="btn" id="startBtn">Start Slithering</button>
  </div>
</div>

<div class="hud">
  <span>Score: <b id="scoreEl">0</b></span>
  <span>Best: <b id="bestEl">0</b></span>
</div>
<p class="controls-hint">Controls: Arrow keys / WASD, or swipe on your phone</p>
<div class="ad-slot"></div>
<script src="../ads.js"></script>

<script src="../config.js"></script>
<script src="nexus-score.js"></script>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const msg = document.getElementById('msg');
const startBtn = document.getElementById('startBtn');
const $ = id => document.getElementById(id);
const GAME_NAME = 'Neon Snake';
function showEnd(head, text, again) {
  msg.classList.remove('hidden');
  msg.innerHTML = '<h2>' + head + '</h2><p>' + text + '</p>';
  const b = document.createElement('button');
  b.className = 'btn'; b.textContent = again; b.onclick = start;
  msg.appendChild(b);
}

const N = 24, CELL = W / N;
let snake, dir, nextDir, food, bonus, score, running, timer, speed, grow;
let best = Number(localStorage.getItem('snake-best') || 0);
$('bestEl').textContent = best;
function rndCell() {
  while (true) {
    const p = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 };
    if (!snake.some(s => s.x === p.x && s.y === p.y)) return p;
  }
}
function start() {
  msg.classList.add('hidden');
  snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
  dir = nextDir = { x: 1, y: 0 }; score = 0; speed = 130; grow = 0; bonus = null;
  food = rndCell(); running = true; $('scoreEl').textContent = 0;
  clearTimeout(timer); tick(); raf();
}
function tick() {
  if (!running) return;
  dir = nextDir;
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) return end();
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) {
    score += 10; grow += 1; food = rndCell(); speed = Math.max(60, speed - 3);
    if (!bonus && Math.random() < 0.25) bonus = Object.assign(rndCell(), { ttl: 40 });
    NexusScore.tone(520, 0, 0.06, 'square', 0.05);
  } else if (bonus && h.x === bonus.x && h.y === bonus.y) {
    score += 50; bonus = null; NexusScore.tone(880, 0, 0.12, 'triangle', 0.06);
  }
  if (grow > 0) grow--; else snake.pop();
  if (bonus && --bonus.ttl <= 0) bonus = null;
  $('scoreEl').textContent = score;
  timer = setTimeout(tick, speed);
}
function raf() {
  if (!running) return;
  ctx.fillStyle = '#0a0b16'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(124,92,255,.08)';
  for (let i = 1; i < N; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, H); ctx.moveTo(0, i * CELL); ctx.lineTo(W, i * CELL); ctx.stroke(); }
  const pulse = 3 + Math.sin(performance.now() / 150) * 2;
  ctx.fillStyle = '#ff5c9e'; ctx.beginPath(); ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3 + pulse / 3, 0, 7); ctx.fill();
  if (bonus) { ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(bonus.x * CELL + CELL / 2, bonus.y * CELL + CELL / 2, CELL / 2 - 2 + pulse / 2, 0, 7); ctx.fill(); }
  const s = NexusScore.skin();
  snake.forEach((p, i) => {
    ctx.fillStyle = i % 2 ? s[1] : s[0];
    ctx.globalAlpha = Math.max(0.45, 1 - i / (snake.length + 6));
    ctx.fillRect(p.x * CELL + 1, p.y * CELL + 1, CELL - 2, CELL - 2);
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(raf);
}
function end() {
  running = false; clearTimeout(timer);
  if (score > best) { best = score; localStorage.setItem('snake-best', best); $('bestEl').textContent = best; }
  showEnd('Crashed!', 'You scored <b>' + score + '</b>. Best: <b>' + best + '</b>', 'Slither Again');
  NexusScore.submit(GAME_NAME, score);
}
function turn(x, y) { if (x !== -dir.x || y !== -dir.y) nextDir = { x, y }; }
addEventListener('keydown', e => {
  const m = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] }[e.key];
  if (m && running) { e.preventDefault(); turn(m[0], m[1]); }
});
let tx, ty;
canvas.addEventListener('pointerdown', e => { tx = e.clientX; ty = e.clientY; });
canvas.addEventListener('pointerup', e => {
  if (tx == null || !running) return;
  const dx = e.clientX - tx, dy = e.clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
  tx = null;
});

startBtn.addEventListener('click', start);
</script>

<script>
(function(){
  function report(message, stack){
    try {
      fetch('/api/games/neon-snake/report-error', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: String(message).slice(0,500), stack: String(stack||'').slice(0,2000)})
      });
    } catch(e) {}
  }
  window.addEventListener('error', function(e){ report(e.message, e.error && e.error.stack); });
  window.addEventListener('unhandledrejection', function(e){
    report('Unhandled promise rejection: ' + e.reason, e.reason && e.reason.stack);
  });
})();
</script>
<script src="/track.js" defer></script>
</body>
</html>
