<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestions — Play Nexus</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .sg-wrap { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  .sg-wrap h1 { margin: 0 0 8px; }
  .sg-wrap p { color: var(--text-muted); }
  .sg-form { display: grid; gap: 12px; margin-top: 20px; }
  .sg-form input, .sg-form textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px; font: inherit;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  .sg-form textarea { min-height: 140px; resize: vertical; }
  #sgStatus, #bugStatus { min-height: 1.4em; }
  #sgStatus.ok, #bugStatus.ok { color: #4ade80; } #sgStatus.err, #bugStatus.err { color: var(--accent-2); }
</style>
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a href="/" class="logo">Play<span>Nexus</span></a>
    <nav><ul><li><a href="/">&larr; Back to Home</a></li></ul></nav>
  </div>
</header>
<main class="sg-wrap">
  <h1>Suggestions</h1>
  <p>Got an idea for a new game, a shop item, or a feature? Tell us!</p>
  <form class="sg-form" id="sgForm">
    <input id="sgName" placeholder="Your name (optional)" maxlength="60">
    <textarea id="sgMsg" placeholder="Your suggestion..." maxlength="1000" required></textarea>
    <button class="btn btn-primary" type="submit">Send Suggestion</button>
    <div id="sgStatus"></div>
  </form>
  <h1 style="margin-top:48px">Report a Bug</h1>
  <p>Found something broken in a game? Describe it and our AI will try to fix it automatically.</p>
  <form class="sg-form" id="bugForm">
    <select id="bugGame" required style="width:100%;padding:12px 14px;border-radius:10px;font:inherit;border:1px solid var(--border);background:var(--card);color:var(--text)"></select>
    <textarea id="bugDesc" placeholder="What went wrong? (e.g. the ball goes through the wall)" maxlength="600" required></textarea>
    <button class="btn btn-primary" type="submit">Report Bug</button>
    <div id="bugStatus"></div>
  </form>
</main>
<script src="/config.js"></script>
<script>
const API = window.PLAY_NEXUS_API_BASE || '';
document.getElementById('sgForm').addEventListener('submit', async e => {
  e.preventDefault();
  const st = document.getElementById('sgStatus');
  st.className = ''; st.textContent = 'Sending...';
  try {
    const r = await fetch(API + '/api/suggestions', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: sgName.value, message: sgMsg.value})
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Failed (' + r.status + ')');
    st.className = 'ok'; st.textContent = 'Thanks! Your suggestion was sent.';
    e.target.reset();
  } catch (err) { st.className = 'err'; st.textContent = err.message; }
});

fetch(API + '/api/games').then(r => r.json()).then(d => {
  bugGame.innerHTML = d.items.filter(g => g.slug).map(g => `<option value="${g.slug}">${g.title.replace(/</g,'&lt;')}</option>`).join('');
}).catch(() => {});
document.getElementById('bugForm').addEventListener('submit', async e => {
  e.preventDefault();
  const st = document.getElementById('bugStatus');
  st.className = ''; st.textContent = 'Sending...';
  try {
    const r = await fetch(API + '/api/bug-reports', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({slug: bugGame.value, description: bugDesc.value})
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Failed (' + r.status + ')');
    st.className = 'ok'; st.textContent = 'Thanks! The AI is working on a fix. It can take a few minutes to go live.';
    bugDesc.value = '';
  } catch (err) { st.className = 'err'; st.textContent = err.message; }
});
</script>
</body>
</html>
