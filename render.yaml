services:
  - type: web
    name: play-nexus
    env: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://letsplaynexus.netlify.app
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: austinhocking1-hash/Play-Nexus
    # Note: persistent disks aren't available on the free plan, so
    # server/playnexus.db will reset on every restart/redeploy here.
    # Upgrade the service's plan in the Render dashboard and add a disk
    # (mount path: /opt/render/project/src/server) if you need data to
    # actually persist.
